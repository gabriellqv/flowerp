name: CI

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - '.husky/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - '.husky/**'

jobs:
  backend-lint:
    name: Backend — Lint (Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
          composer-options: '--prefer-dist --no-progress'

      - name: Rodar Pint (verificacao de estilo PHP)
        run: ./vendor/bin/pint --test

  backend-tests:
    name: Backend — Testes (Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
          composer-options: '--prefer-dist --no-progress'

      - name: Copiar .env de teste
        run: cp .env.example .env

      - name: Gerar chave da aplicacao
        run: php artisan key:generate

      - name: Rodar Pest (testes automatizados)
        run: php artisan test --parallel

  frontend-checks:
    name: Frontend — Lint, Type Check e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Rodar ESLint (verificacao de estilo TS/Vue)
        run: npm run lint

      - name: Rodar type check (vue-tsc)
        run: npm run type-check

      - name: Rodar Vitest (testes automatizados)
        run: npm run test
